name: catatan_keuangan
description: Aplikasi pencatatan keuangan pribadi dengan arsitektur MVC.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Versi intl mengikuti yang dipatok oleh flutter_localizations.
  intl: any
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
