name: catatan_keuangan
description: Aplikasi pencatatan keuangan pribadi dengan arsitektur MVC.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  excel: ^4.0.6
  file_picker: ^13.4.1
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_localizations:
    sdk: flutter
  # Versi intl mengikuti yang dipatok oleh flutter_localizations.
  geocoding: ^5.0.1
  geolocator: ^14.0.1
  http: ^1.6.0
  intl: any
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  provider: ^6.1.5+1
  shared_preferences: ^2.3.0
  sqflite: ^2.4.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
